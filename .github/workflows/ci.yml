name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Type check
        run: |
          for p in context agent memory tools-mcp tools-browser; do
            npx tsc -p packages/$p/tsconfig.json --noEmit
          done
      - name: Test
        run: npm test --if-present
